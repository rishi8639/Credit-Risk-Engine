<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Credit Risk Decision System</title>
<style>
/* ---------- GLOBAL ---------- */
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg, #0a0d1a 0%, #0d1425 25%, #0f1b35 50%, #0d1425 75%, #0a0d1a 100%);
    font-family:Consolas, monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e8f4f8;
    overflow:hidden;
    position:relative;
}

/* Add animated gradient overlay */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(125,211,252,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(186,230,253,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(232,121,249,0.04) 0%, transparent 50%);
    animation:gradient-shift 15s ease-in-out infinite;
    z-index:0;
}

@keyframes gradient-shift{
    0%, 100% { opacity:0.6; }
    50% { opacity:0.8; }
}

/* ---------- ANIMATED BACKGROUND ---------- */
/* Neural Network Grid Base */
.background-layer{
    position:fixed;
    inset:0;
    z-index:1;
}

/* Frosted glass orbs floating in background */
.glass-orb{
    position:absolute;
    border-radius:50%;
    backdrop-filter:blur(60px);
    border:1px solid rgba(255,255,255,0.15);
    animation:float-orb 20s ease-in-out infinite;
}

.glass-orb-1{
    width:500px;
    height:500px;
    background:rgba(156,220,254,0.15);
    box-shadow:inset 0 0 60px rgba(156,220,254,0.25), 0 0 120px rgba(156,220,254,0.2);
    top:-10%;
    left:-5%;
    animation-delay:0s;
}

.glass-orb-2{
    width:400px;
    height:400px;
    background:rgba(203,213,225,0.12);
    box-shadow:inset 0 0 60px rgba(203,213,225,0.22), 0 0 120px rgba(203,213,225,0.15);
    bottom:-8%;
    right:-5%;
    animation-delay:7s;
}

.glass-orb-3{
    width:350px;
    height:350px;
    background:rgba(125,211,252,0.14);
    box-shadow:inset 0 0 50px rgba(125,211,252,0.2), 0 0 100px rgba(125,211,252,0.15);
    top:30%;
    right:10%;
    animation-delay:14s;
}

.glass-orb-4{
    width:300px;
    height:300px;
    background:rgba(232,121,249,0.08);
    box-shadow:inset 0 0 50px rgba(232,121,249,0.15), 0 0 90px rgba(232,121,249,0.1);
    bottom:20%;
    left:15%;
    animation-delay:3s;
}

@keyframes float-orb{
    0%, 100% { transform:translate(0, 0) scale(1); }
    25% { transform:translate(30px, -40px) scale(1.05); }
    50% { transform:translate(-20px, -60px) scale(0.95); }
    75% { transform:translate(40px, -30px) scale(1.02); }
}

/* Flowing wave lines */
.wave-container{
    position:absolute;
    inset:0;
    overflow:hidden;
    opacity:0.6;
    z-index:1;
}

.wave-line{
    position:absolute;
    width:200%;
    height:2px;
    background:linear-gradient(90deg, transparent, rgba(125,211,252,0.4), rgba(186,230,253,0.3), transparent);
    animation:wave-flow 15s ease-in-out infinite;
}

.wave-line:nth-child(1){
    top:20%;
    left:-50%;
    animation-delay:0s;
    background:linear-gradient(90deg, transparent, rgba(125,211,252,0.5), transparent);
}

.wave-line:nth-child(2){
    top:25%;
    left:-50%;
    animation-delay:0.5s;
    background:linear-gradient(90deg, transparent, rgba(186,230,253,0.3), transparent);
}

.wave-line:nth-child(3){
    top:30%;
    left:-50%;
    animation-delay:1s;
    background:linear-gradient(90deg, transparent, rgba(125,211,252,0.4), transparent);
}

.wave-line:nth-child(4){
    top:50%;
    left:-50%;
    animation-delay:2s;
    background:linear-gradient(90deg, transparent, rgba(232,121,249,0.4), rgba(125,211,252,0.3), transparent);
    height:3px;
}

.wave-line:nth-child(5){
    top:55%;
    left:-50%;
    animation-delay:2.5s;
    background:linear-gradient(90deg, transparent, rgba(186,230,253,0.35), transparent);
}

.wave-line:nth-child(6){
    top:70%;
    left:-50%;
    animation-delay:3s;
    background:linear-gradient(90deg, transparent, rgba(125,211,252,0.3), transparent);
}

@keyframes wave-flow{
    0% { transform:translateY(0) translateX(0); }
    50% { transform:translateY(-30px) translateX(5%); }
    100% { transform:translateY(0) translateX(0); }
}

/* Geometric shapes floating */
.geo-shape{
    position:absolute;
    border:2px solid rgba(186,230,253,0.3);
    animation:float-geo 20s ease-in-out infinite;
}

.geo-circle{
    border-radius:50%;
}

.geo-diamond{
    transform:rotate(45deg);
}

.geo-shape:nth-child(7){
    width:80px;
    height:80px;
    top:15%;
    right:10%;
    animation-delay:0s;
}

.geo-shape:nth-child(8){
    width:60px;
    height:60px;
    top:60%;
    left:8%;
    animation-delay:3s;
}

.geo-shape:nth-child(9){
    width:50px;
    height:50px;
    top:35%;
    left:5%;
    animation-delay:6s;
}

.geo-shape:nth-child(10){
    width:70px;
    height:70px;
    bottom:20%;
    right:15%;
    animation-delay:9s;
}

.geo-shape:nth-child(11){
    width:40px;
    height:40px;
    top:75%;
    right:25%;
    animation-delay:12s;
}

.geo-shape:nth-child(12){
    width:55px;
    height:55px;
    bottom:35%;
    left:20%;
    animation-delay:15s;
}

@keyframes float-geo{
    0%, 100% { transform:translateY(0) rotate(45deg); opacity:0.3; }
    25% { transform:translateY(-20px) rotate(50deg); opacity:0.5; }
    50% { transform:translateY(-35px) rotate(40deg); opacity:0.4; }
    75% { transform:translateY(-20px) rotate(50deg); opacity:0.5; }
}

/* Particle dots grid */
.particle-grid{
    position:absolute;
    top:0;
    right:0;
    width:300px;
    height:100%;
    display:grid;
    grid-template-columns:repeat(8, 1fr);
    grid-template-rows:repeat(20, 1fr);
    gap:15px;
    padding:40px 60px;
    opacity:0.5;
}

.particle-dot{
    width:4px;
    height:4px;
    background:rgba(186,230,253,0.6);
    border-radius:50%;
    animation:pulse-dot 3s ease-in-out infinite;
}

.particle-dot:nth-child(odd){
    animation-delay:0s;
    background:rgba(232,121,249,0.5);
}

.particle-dot:nth-child(even){
    animation-delay:1.5s;
}

.particle-dot:nth-child(3n){
    animation-delay:0.5s;
    background:rgba(125,211,252,0.6);
}

.particle-dot:nth-child(4n){
    animation-delay:1s;
}

@keyframes pulse-dot{
    0%, 100% { opacity:0.3; transform:scale(1); }
    50% { opacity:1; transform:scale(1.5); }
}

/* Particle dots grid LEFT side */
.particle-grid-left{
    position:absolute;
    top:0;
    left:0;
    width:200px;
    height:100%;
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    grid-template-rows:repeat(15, 1fr);
    gap:20px;
    padding:40px 40px;
    opacity:0.4;
}

/* Subtle grid pattern */
.background-layer::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(125,211,252,0.06) 2px, rgba(125,211,252,0.06) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(125,211,252,0.06) 2px, rgba(125,211,252,0.06) 4px),
        radial-gradient(circle at 30% 40%, rgba(125,211,252,0.05) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(186,230,253,0.04) 0%, transparent 40%);
    background-size:50px 50px, 50px 50px, 100% 100%, 100% 100%;
    opacity:.7;
    z-index:2;
}

/* Radial glow effect */
.background-layer::after{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    width:1000px;
    height:1000px;
    background:
        radial-gradient(circle, rgba(125,211,252,0.18) 0%, rgba(186,230,253,0.1) 30%, rgba(203,213,225,0.05) 50%, transparent 70%);
    animation:pulse 4s ease-in-out infinite;
    z-index:1;
}

/* Floating neural nodes */
.neural-node{
    position:absolute;
    width:6px;
    height:6px;
    background:#bae6fd;
    border-radius:50%;
    box-shadow:0 0 20px rgba(186,230,253,0.9), 0 0 40px rgba(125,211,252,0.5);
    animation:float-node 8s ease-in-out infinite;
    z-index:2;
}

.neural-node:nth-child(1) { top:20%; left:15%; animation-delay:0s; }
.neural-node:nth-child(2) { top:40%; left:25%; animation-delay:0.8s; }
.neural-node:nth-child(3) { top:60%; left:20%; animation-delay:1.6s; }
.neural-node:nth-child(4) { top:30%; left:50%; animation-delay:1.2s; }
.neural-node:nth-child(5) { top:70%; left:45%; animation-delay:2s; }
.neural-node:nth-child(6) { top:25%; left:75%; animation-delay:2.5s; }
.neural-node:nth-child(7) { top:55%; left:80%; animation-delay:3s; }
.neural-node:nth-child(8) { top:80%; left:70%; animation-delay:3.5s; }

/* Connection lines between nodes */
.connection-line{
    position:absolute;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(203,213,225,0.3), rgba(125,211,252,0.3), transparent);
    transform-origin:left center;
    animation:pulse-line 3s ease-in-out infinite;
    z-index:1;
}

.connection-line:nth-child(1) { 
    top:15%; left:10%; width:40%; 
    transform:rotate(5deg);
    animation-delay:0s;
}
.connection-line:nth-child(2) { 
    top:25%; left:20%; width:30%; 
    transform:rotate(-3deg);
    animation-delay:0.5s;
}
.connection-line:nth-child(3) { 
    top:65%; left:18%; width:64%; 
    transform:rotate(2deg);
    animation-delay:1s;
}
.connection-line:nth-child(4) { 
    top:40%; left:15%; width:35%; 
    transform:rotate(8deg);
    animation-delay:1.5s;
}
.connection-line:nth-child(5) { 
    top:60%; left:50%; width:32%; 
    transform:rotate(-5deg);
    animation-delay:2s;
}

/* Data particles flowing */
.data-particle{
    position:absolute;
    width:3px;
    height:3px;
    background:#bae6fd;
    border-radius:50%;
    box-shadow:0 0 10px rgba(186,230,253,0.9);
    animation:particle-flow 15s linear infinite;
    z-index:2;
}

.data-particle:nth-child(1) { top:20%; animation-delay:0s; }
.data-particle:nth-child(2) { top:40%; animation-delay:3s; }
.data-particle:nth-child(3) { top:60%; animation-delay:6s; }
.data-particle:nth-child(4) { top:80%; animation-delay:9s; }
.data-particle:nth-child(5) { top:30%; animation-delay:12s; }
.data-particle:nth-child(6) { top:70%; animation-delay:2s; }

/* ---------- ANIMATIONS ---------- */
@keyframes pulse{
    0%, 100% { opacity:0.3; transform:translate(-50%, -50%) scale(1); }
    50% { opacity:0.6; transform:translate(-50%, -50%) scale(1.1); }
}

@keyframes float-node{
    0%, 100% { transform:translateY(0); }
    50% { transform:translateY(-20px); }
}

@keyframes pulse-line{
    0%, 100% { opacity:0.3; }
    50% { opacity:0.8; }
}

@keyframes particle-flow{
    0% { transform:translateX(-100px); opacity:0; }
    10% { opacity:1; }
    90% { opacity:1; }
    100% { transform:translateX(calc(100vw + 100px)); opacity:0; }
}

/* ---------- PANEL ---------- */
.panel{
    width:460px;
    padding:45px;
    border-radius:28px;
    background:rgba(10,13,26,0.85);
    backdrop-filter:blur(30px) saturate(180%);
    -webkit-backdrop-filter:blur(30px) saturate(180%);
    border:1px solid rgba(186,230,253,0.25);
    box-shadow:
        0 8px 32px 0 rgba(125,211,252,0.3),
        0 0 80px rgba(203,213,225,0.2),
        inset 0 0 40px rgba(255,255,255,0.05),
        inset 0 1px 0 rgba(255,255,255,0.15);
    text-align:center;
    position:relative;
    z-index:10;
    animation:panel-enter 0.8s ease-out;
}

/* Glass reflection effect */
.panel::after{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:50%;
    background:linear-gradient(180deg, 
        rgba(255,255,255,0.1) 0%, 
        rgba(255,255,255,0.05) 50%,
        transparent 100%);
    border-radius:28px 28px 0 0;
    pointer-events:none;
}

@keyframes panel-enter{
    from { 
        opacity:0; 
        transform:translateY(30px) scale(0.95); 
    }
    to { 
        opacity:1; 
        transform:translateY(0) scale(1); 
    }
}

/* Animated border effect */
.panel::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:28px;
    background:linear-gradient(45deg, 
        transparent, 
        rgba(186,230,253,0.3), 
        rgba(203,213,225,0.3), 
        transparent, 
        rgba(125,211,252,0.3), 
        transparent);
    background-size:200% 200%;
    animation:border-flow 4s linear infinite;
    z-index:-1;
    opacity:0.6;
}

@keyframes border-flow{
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
}

/* title */
.title{
    font-size:24px;
    letter-spacing:1.5px;
    margin-bottom:35px;
    background:linear-gradient(135deg, #e2e8f0 0%, #bae6fd 30%, #7dd3fc 60%, #38bdf8 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 0 15px rgba(186,230,253,0.7)) drop-shadow(0 0 30px rgba(125,211,252,0.4));
    animation:title-glow 3s ease-in-out infinite;
}

@keyframes title-glow{
    0%, 100% { 
        filter:drop-shadow(0 0 15px rgba(186,230,253,0.7)) drop-shadow(0 0 30px rgba(125,211,252,0.4)); 
    }
    50% { 
        filter:drop-shadow(0 0 20px rgba(186,230,253,1)) drop-shadow(0 0 40px rgba(125,211,252,0.6)); 
    }
}

/* ---------- TABLE ---------- */
table{
    width:100%;
    border-spacing:0 20px;
    text-align:left;
    font-size:14px;
}

/* ---------- INPUT ---------- */
input{
    width:100%;
    padding:12px 14px;
    border-radius:14px;
    border:1px solid rgba(125,211,252,0.3);
    background:rgba(15,27,53,0.4);
    color:#e0f2fe;
    outline:none;
    font-family:Consolas, monospace;
    transition:all 0.3s ease;
}

input::selection{
    background:#7dd3fc;
    color:#0a0d1a;
}

input:focus{
    border:1px solid #7dd3fc;
    background:rgba(15,27,53,0.6);
    box-shadow:0 0 15px rgba(125,211,252,0.6), inset 0 0 10px rgba(125,211,252,0.15);
}

/* ---------- BUTTON ---------- */
button{
    width:100%;
    padding:14px;
    border-radius:18px;
    border:1px solid #7dd3fc;
    background:transparent;
    color:#bae6fd;
    font-weight:bold;
    letter-spacing:1.5px;
    cursor:pointer;
    transition:all 0.3s ease;
    font-family:Consolas, monospace;
    position:relative;
    overflow:hidden;
}

button::before{
    content:"";
    position:absolute;
    top:50%;
    left:50%;
    width:0;
    height:0;
    border-radius:50%;
    background:linear-gradient(135deg, rgba(125,211,252,0.4), rgba(186,230,253,0.3));
    transform:translate(-50%, -50%);
    transition:width 0.6s ease, height 0.6s ease;
}

button:hover::before{
    width:300px;
    height:300px;
}

button:hover{
    background:linear-gradient(135deg, #7dd3fc 0%, #38bdf8 100%);
    color:#0a0d1a;
    border-color:#38bdf8;
    box-shadow:0 0 25px rgba(125,211,252,0.7), 0 0 50px rgba(186,230,253,0.4);
    transform:translateY(-2px);
}

button span{
    position:relative;
    z-index:1;
}
</style>
</head>
